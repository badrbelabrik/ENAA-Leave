services:

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: enaa-leave-api
        restart: unless-stopped
        ports:
            - "8000:80"
        env_file:
            - .env.docker
        depends_on:
            - mysql
        volumes:
            - ./storage:/var/www/html/storage

    mysql:
        image: mysql:8.4
        container_name: enaa-leave-mysql
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: enaa_leave
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - enaa_leave_mysql_data:/var/lib/mysql

volumes:
    enaa_leave_mysql_data:
